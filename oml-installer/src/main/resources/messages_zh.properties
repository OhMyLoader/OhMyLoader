cli.help=OhMyLoader 安装器（命令行模式）\n\n用法：java -jar oml-installer.jar [选项]\n\n安装形态\n  --target <standard|prism|server>   standard=装进启动器的 .minecraft（默认）\n                                     prism=装进 Prism/MultiMC 实例目录\n                                     server=生成自举的专用服务端目录\n  --side <client|server>             未指定 --target 时的简写：server 等价于 --target server\n\n目标\n  --version <版本>                  游戏版本（必填）\n  --dir <目录>                       目标目录（必填）\n  --id <安装 id>                     默认 <版本>-OML；多实例共存的隔离键\n\n隔离与合规\n  --isolation <true|false>           标准启动器形态必填：true=mods 放在版本目录内\n  --accept-shared-mods               显式确认「共享 mods 目录」的风险\n  --accept-eula                      服务端安装时表示你已阅读并同意 EULA\n  --add-prism-component               Prism 形态：同时把组件写进 mmc-pack.json\n\n资源来源（默认直接用安装器自带的加载器层，无需任何参数）\n  --layer-jar <文件>                 加载器 jar（可重复；含 Kotlin / ASM 等依赖）\n  --shell-jar <文件>                 服务端形态需要的 oml-launcher.jar\n  说明：这两个参数用于从构建目录安装，不给则使用安装器内置的那一份。\n\n网络\n  --proxy <host:port>                通过代理下载（默认使用系统代理设置）\n\n  --help                             显示本帮助\n\n不带参数运行会启动图形安装程序。
