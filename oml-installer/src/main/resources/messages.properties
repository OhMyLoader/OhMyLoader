# OhMyLoader installer — default (English) bundle.
#
# This file is the fallback: any locale we do not ship a translation for lands here, so every key used
# by the code must be present. Keep the key set identical to messages_zh.properties (there is a test
# for that).
#
# Encoding: UTF-8 (Java 9+ reads property resource bundles as UTF-8; the GUI runs on Java 27 only).
# Plain text — no ISO-8859-1 escapes needed.
#
# Placeholders: {0}, {1}, … substituted by Messages.t. Use \n for a line break.
