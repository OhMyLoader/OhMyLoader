cli.help=OhMyLoader installer (command line)\n\nUsage: java -jar oml-installer.jar [options]\n\nInstall type\n  --target <standard|prism|server>   standard = into a launcher's .minecraft (default)\n                                     prism = into a Prism/MultiMC instance folder\n                                     server = build a self-bootstrapping dedicated server\n  --side <client|server>             shorthand when --target is omitted: server = --target server\n\nTarget\n  --version <version>                game version (required); `snapshot` = the manifest's latest snapshot, installed under its real id\n  --dir <folder>                     target folder (required)\n  --id <install id>                  default <version>-OML; the isolation key for multiple instances\n\nIsolation & compliance\n  --isolation <true|false>           required for the standard type: true = mods inside the version folder\n  --accept-shared-mods               explicitly acknowledge the risk of a shared mods folder\n  --accept-eula                      for a server install: you have read and accept the EULA\n  --add-prism-component               Prism type: also register the component in mmc-pack.json\n\nUninstall\n  --uninstall                        remove what an earlier install wrote (--target/--dir/--id apply;\n                                     --version optional, only to derive the default install id)\n\nResources (by default the installer uses its own bundled layer)\n  --layer-jar <file>                 loader jar (repeatable; includes Kotlin / ASM)\n  --shell-jar <file>                 oml-launcher.jar, needed for the server type\n  Note: pass these to install from a build tree instead of the bundled copy.\n\nNetwork\n  --proxy <host:port>                download through a proxy (default: the system proxy settings)\n\n  --help                             show this help\n\nRunning the jar without arguments opens the graphical installer.
