# ---------------------------------------------------------------- start scripts
# These end up inside run.sh (after #) and run.bat (after rem / echo). Keep the text free of characters
# that are special to either shell: parentheses break `rem` inside a batch block, and $ / % must not
# appear at all — they would be expanded by the shell instead of being printed.
