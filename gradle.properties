org.gradle.caching=true
org.gradle.configuration-cache=true
# The single source of truth for OML's own version. It is bound to `project.version` for every
# published module (see build-logic/src/main/kotlin/oml/convention/publishing.gradle.kts), and it
# is stamped into oml-core's `oml-core.properties` at resource-processing time — from where
# OMLCore.VERSION reads it back at runtime. A release is one edit here, everywhere.
#
# This is not the `libs.versions.toml` catalog: the catalog holds *third-party* coordinates the build
# consumes, while this is the coordinate the build *produces*.
oml_version=0.1.0-SNAPSHOT
# The group every OML artifact is published under. Kept here rather than in each module script so a
# module can never silently drift onto a different group.
oml_group=org.ohmyloader
