name: Install the OML JDK bundle
description: >
  Installs the 27.0.2-internal JDK the whole OML layer requires (JDK-8394484).
  The bundle is a public release asset, so this action needs no token and works
  for fork pull requests; the sha256 input pins the bytes.

inputs:
  url:
    description: Public release asset URL for the platform's JDK bundle.
    required: true
  sha256:
    description: Expected SHA-256 of the downloaded release asset zip.
    required: true

runs:
  using: composite
  steps:
    - name: Install the JDK bundle (Linux)
      if: runner.os != 'Windows'
      shell: bash
      env:
        JDK_URL: ${{ inputs.url }}
        EXPECTED_SHA256: ${{ inputs.sha256 }}
      run: |
        set -euo pipefail
        if [ -z "${JDK_URL:-}" ]; then
          echo "::error::JDK_URL is empty."
          exit 1
        fi
        curl -fL --retry 3 --retry-delay 2 -o "$RUNNER_TEMP/jdk-bundle.zip" "$JDK_URL"
        expected="${EXPECTED_SHA256#sha256:}"
        if [ -n "$expected" ]; then
          actual=$(sha256sum "$RUNNER_TEMP/jdk-bundle.zip" | awk '{print $1}')
          if [ "$actual" != "$expected" ]; then
            echo "::error::JDK bundle digest mismatch: expected $expected, got $actual"
            exit 1
          fi
        fi
        mkdir -p "$RUNNER_TEMP/jdk"
        unzip -q "$RUNNER_TEMP/jdk-bundle.zip" -d "$RUNNER_TEMP/jdk"
        # The bundle holds jdk-<platform>.(tar.gz|zip) next to symbols/tests siblings; match the
        # jdk* name explicitly — a generic archive glob would race on readdir order and sometimes
        # unpack the symbols or tests bundle instead (manifesting as "does not contain bin/java").
        if ! find -L "$RUNNER_TEMP/jdk" -path '*/bin/java' | grep -q .; then
          inner=$(find "$RUNNER_TEMP/jdk" -type f \( -name 'jdk*.zip' -o -name 'jdk*.tar.gz' -o -name 'jdk*.tgz' \) -print -quit)
          if [ -z "$inner" ]; then
            echo "::error::The bundle contains no jdk* archive; contents: $(ls "$RUNNER_TEMP/jdk")"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/jdk-x"
          case "$inner" in
            *.zip) unzip -q "$inner" -d "$RUNNER_TEMP/jdk-x" ;;
            *) tar -xzf "$inner" -C "$RUNNER_TEMP/jdk-x" ;;
          esac
          rm -rf "$RUNNER_TEMP/jdk"
          mv "$RUNNER_TEMP/jdk-x" "$RUNNER_TEMP/jdk"
        fi
        java_bin=$(find -L "$RUNNER_TEMP/jdk" -path '*/bin/java' -type f -print -quit)
        if [ -z "$java_bin" ]; then
          echo "::error::The JDK bundle does not contain bin/java."
          exit 1
        fi
        java_home=$(dirname "$(dirname "$java_bin")")
        "$java_bin" -version
        echo "JAVA_HOME=$java_home" >> "$GITHUB_ENV"
        echo "$java_home/bin" >> "$GITHUB_PATH"

    - name: Install the JDK bundle (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        JDK_URL: ${{ inputs.url }}
        EXPECTED_SHA256: ${{ inputs.sha256 }}
      run: |
        $ErrorActionPreference = 'Stop'
        if (-not $env:JDK_URL) { throw "JDK_URL is empty." }
        curl.exe -fL --retry 3 --retry-delay 2 -o "$env:RUNNER_TEMP\jdk-bundle.zip" $env:JDK_URL
        if ($LASTEXITCODE -ne 0) { throw "JDK bundle download failed: $env:JDK_URL" }
        $expected = ($env:EXPECTED_SHA256 -replace '^sha256:', '').ToLowerInvariant()
        if ($expected) {
          $actual = (Get-FileHash "$env:RUNNER_TEMP\jdk-bundle.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "JDK bundle digest mismatch: expected $expected, got $actual" }
        }
        Expand-Archive "$env:RUNNER_TEMP\jdk-bundle.zip" -DestinationPath "$env:RUNNER_TEMP\jdk"
        $java = Get-ChildItem "$env:RUNNER_TEMP\jdk" -Recurse -Filter java.exe |
          Where-Object { $_.DirectoryName -like '*\bin' } | Select-Object -First 1
        if (-not $java) {
          # The bundle holds jdk-<platform>.(zip|tar.gz) next to symbols/tests siblings; match the
          # jdk* name explicitly — a generic archive glob races on enumeration order and sometimes
          # unpacks the symbols or tests bundle instead (no java.exe).
          $inner = Get-ChildItem "$env:RUNNER_TEMP\jdk" -Recurse -Include jdk*.zip, jdk*.tar.gz, jdk*.tgz |
            Select-Object -First 1
          if (-not $inner) { throw "The bundle contains no jdk* archive." }
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\jdk-x" | Out-Null
          if ($inner.Extension -eq '.zip') {
            Expand-Archive $inner.FullName -DestinationPath "$env:RUNNER_TEMP\jdk-x"
          } else {
            tar -xzf $inner.FullName -C "$env:RUNNER_TEMP\jdk-x"
          }
          Remove-Item -Recurse -Force "$env:RUNNER_TEMP\jdk"
          Rename-Item "$env:RUNNER_TEMP\jdk-x" "jdk"
          $java = Get-ChildItem "$env:RUNNER_TEMP\jdk" -Recurse -Filter java.exe |
            Where-Object { $_.DirectoryName -like '*\bin' } | Select-Object -First 1
        }
        if (-not $java) { throw "The JDK bundle does not contain bin/java.exe." }
        $h = Split-Path $java.DirectoryName -Parent
        & "$h\bin\java.exe" -version
        "JAVA_HOME=$h" >> $env:GITHUB_ENV
        "$h\bin" >> $env:GITHUB_PATH
