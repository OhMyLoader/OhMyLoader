name: Install the OML JDK bundle
description: >
  Installs the 27.0.2-internal JDK the whole OML layer requires (JDK-8394484).
  The bundle is a GitHub Actions artifact of raneashay/jdk-27. The workflow's
  GITHUB_TOKEN is scoped to the repository that runs the workflow, so it cannot
  download another repository's artifact: the token input must be a PAT (or
  GitHub App token) with Actions read permission on raneashay/jdk-27.

inputs:
  token:
    description: Token with actions:read on raneashay/jdk-27 (OML_JDK_ARTIFACT_TOKEN).
    required: true
  run-id:
    description: raneashay/jdk-27 workflow run id that produced the bundle.
    required: true
  bundle:
    description: Artifact name, bundles-linux-x64 or bundles-windows-x64.
    required: true
  sha256:
    description: Expected SHA-256 of the downloaded artifact zip; optional but recommended.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Install the JDK bundle (Linux)
      if: runner.os != 'Windows'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        JDK_RUN_ID: ${{ inputs.run-id }}
        JDK_BUNDLE: ${{ inputs.bundle }}
        EXPECTED_SHA256: ${{ inputs.sha256 }}
      run: |
        set -euo pipefail
        if [ -z "${GH_TOKEN:-}" ]; then
          echo "::error::OML_JDK_ARTIFACT_TOKEN is empty. Create a fine-grained PAT with Actions:read on raneashay/jdk-27 and store it as that repository secret."
          exit 1
        fi
        if ! id=$(gh api "repos/raneashay/jdk-27/actions/runs/$JDK_RUN_ID/artifacts?per_page=100" \
          --jq "map(select(.name == \"$JDK_BUNDLE\" and .expired == false) | .id)[0]"); then
          echo "::error::Could not list raneashay/jdk-27 artifacts. OML_JDK_ARTIFACT_TOKEN needs Actions:read on that repository."
          exit 1
        fi
        if [ -z "$id" ] || [ "$id" = "null" ]; then
          echo "::error::No unexpired '$JDK_BUNDLE' artifact in raneashay/jdk-27 run $JDK_RUN_ID. Artifacts expire after five days; point JDK_RUN_ID at a newer run and update the digest."
          exit 1
        fi
        gh api "repos/raneashay/jdk-27/actions/artifacts/$id/zip" > "$RUNNER_TEMP/jdk-bundle.zip"
        expected="${EXPECTED_SHA256#sha256:}"
        if [ -n "$expected" ]; then
          actual=$(sha256sum "$RUNNER_TEMP/jdk-bundle.zip" | awk '{print $1}')
          if [ "$actual" != "$expected" ]; then
            echo "::error::JDK bundle digest mismatch: expected $expected, got $actual"
            exit 1
          fi
        fi
        mkdir -p "$RUNNER_TEMP/jdk"
        unzip -q "$RUNNER_TEMP/jdk-bundle.zip" -d "$RUNNER_TEMP/jdk"
        # The artifact may hold the JDK as a nested bundle archive or as a bare tree; open it
        # only when bin/java is not there yet.
        if ! find -L "$RUNNER_TEMP/jdk" -path '*/bin/java' | grep -q .; then
          inner=$(find "$RUNNER_TEMP/jdk" -type f \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.tgz' \) | head -1)
          mkdir -p "$RUNNER_TEMP/jdk-x"
          case "$inner" in
            *.zip) unzip -q "$inner" -d "$RUNNER_TEMP/jdk-x" ;;
            *) tar -xzf "$inner" -C "$RUNNER_TEMP/jdk-x" ;;
          esac
          rm -rf "$RUNNER_TEMP/jdk"
          mv "$RUNNER_TEMP/jdk-x" "$RUNNER_TEMP/jdk"
        fi
        home=$(dirname "$(find -L "$RUNNER_TEMP/jdk" -path '*/bin/java' | head -1)")
        "$home/bin/java" -version
        echo "JAVA_HOME=$home" >> "$GITHUB_ENV"
        echo "$home/bin" >> "$GITHUB_PATH"

    - name: Install the JDK bundle (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        GH_TOKEN: ${{ inputs.token }}
        JDK_RUN_ID: ${{ inputs.run-id }}
        JDK_BUNDLE: ${{ inputs.bundle }}
        EXPECTED_SHA256: ${{ inputs.sha256 }}
      run: |
        $ErrorActionPreference = 'Stop'
        if (-not $env:GH_TOKEN) {
          throw "OML_JDK_ARTIFACT_TOKEN is empty. Create a fine-grained PAT with Actions:read on raneashay/jdk-27 and store it as that repository secret."
        }
        $id = gh api "repos/raneashay/jdk-27/actions/runs/$env:JDK_RUN_ID/artifacts?per_page=100" `
          --jq "map(select(.name == '$env:JDK_BUNDLE' and .expired == false) | .id)[0]"
        if ($LASTEXITCODE -ne 0) {
          throw "Could not list raneashay/jdk-27 artifacts. OML_JDK_ARTIFACT_TOKEN needs Actions:read on that repository."
        }
        if (-not $id -or $id -eq 'null') {
          throw "No unexpired '$env:JDK_BUNDLE' artifact in raneashay/jdk-27 run $env:JDK_RUN_ID. Artifacts expire after five days; point JDK_RUN_ID at a newer run and update the digest."
        }
        gh api "repos/raneashay/jdk-27/actions/artifacts/$id/zip" > "$env:RUNNER_TEMP\jdk-bundle.zip"
        if ($LASTEXITCODE -ne 0) { throw "Artifact download failed." }
        $expected = ($env:EXPECTED_SHA256 -replace '^sha256:', '').ToLowerInvariant()
        if ($expected) {
          $actual = (Get-FileHash "$env:RUNNER_TEMP\jdk-bundle.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "JDK bundle digest mismatch: expected $expected, got $actual" }
        }
        Expand-Archive "$env:RUNNER_TEMP\jdk-bundle.zip" -DestinationPath "$env:RUNNER_TEMP\jdk"
        $java = Get-ChildItem "$env:RUNNER_TEMP\jdk" -Recurse -Filter java.exe |
          Where-Object { $_.DirectoryName -like '*\bin' } | Select-Object -First 1
        if (-not $java) {
          # The artifact may hold the JDK as a nested bundle archive; open it and look again.
          $inner = Get-ChildItem "$env:RUNNER_TEMP\jdk" -Recurse -Include *.zip, *.tar.gz, *.tgz |
            Select-Object -First 1
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\jdk-x" | Out-Null
          if ($inner.Extension -eq '.zip') {
            Expand-Archive $inner.FullName -DestinationPath "$env:RUNNER_TEMP\jdk-x"
          } else {
            tar -xzf $inner.FullName -C "$env:RUNNER_TEMP\jdk-x"
          }
          Remove-Item -Recurse -Force "$env:RUNNER_TEMP\jdk"
          Rename-Item "$env:RUNNER_TEMP\jdk-x" "jdk"
          $java = Get-ChildItem "$env:RUNNER_TEMP\jdk" -Recurse -Filter java.exe |
            Where-Object { $_.DirectoryName -like '*\bin' } | Select-Object -First 1
        }
        if (-not $java) { throw "The JDK bundle does not contain bin/java.exe." }
        $h = Split-Path $java.DirectoryName -Parent
        & "$h\bin\java.exe" -version
        "JAVA_HOME=$h" >> $env:GITHUB_ENV
        "$h\bin" >> $env:GITHUB_PATH
