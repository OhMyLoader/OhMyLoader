# This workflow compiles, tests and packages. The real client and server launch
# verification runs in the OhMyLoaderTestMod repository, whose end-to-end mod consumes
# this build's artifacts by Maven coordinate.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '27'
      # oml-native is built from source as part of `build` (the installer embeds it)
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: gradle/actions/setup-gradle@v6
      # Build-cache entries are content-addressed by task inputs, so a stale snapshot only
      # lowers the hit rate, never yields wrong outputs — the key can err on the coarse side.
      # A source fingerprint misses the exact key once per source change, restores the latest
      # snapshot via the prefix and saves the new outputs on top; a static key would exact-hit
      # forever and never store anything new (save is skipped on exact hits). modules-2 and
      # the wrapper dist stay out: dependency resolution has its own surface and would blow
      # the 10 GB repo cap.
      - uses: actions/cache@v6
        with:
          path: ~/.gradle/caches/build-cache-*
          key: gradle-build-cache-${{ runner.os }}-${{ hashFiles('**/*.kt', '**/*.kts', '**/*.java', 'gradle/libs.versions.toml', 'gradle.properties') }}
          restore-keys: |
            gradle-build-cache-${{ runner.os }}-
      # HookShapeTest and the adapter compile read the vanilla client jar; caching it
      # avoids a full Piston download on every run. The key hashes the build files that
      # declare which game versions are wanted, so a new version invalidates the cache;
      # oml-adapter-common/libs holds the jar its compileOnly/testImplementation wiring reads.
      - uses: actions/cache@v6
        with:
          path: |
            oml-adapter-26_3/libs
            oml-adapter-snapshot/libs
            oml-adapter-common/libs
          key: client-jars-${{ hashFiles('oml-adapter-26_3/build.gradle.kts', 'oml-adapter-snapshot/build.gradle.kts', 'oml-adapter-common/build.gradle.kts') }}
          restore-keys: |
            client-jars-
      # tag builds produce the release-versioned installer here, so the release job can
      # attach this exact artifact instead of rebuilding it
      - name: Compute the release version for tag builds
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "OML_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      # The Gradle task runs `zig build --install` only, so the C library's own unit tests are not
      # part of `build` and would never run without this step.
      - name: oml-native unit tests
        working-directory: oml-native
        run: zig build test
      - run: ./gradlew ${OML_VERSION:+-Poml_version=$OML_VERSION} build
      # The verification mod consumes this exact staging directory; the release job rebuilds and
      # compares against it before publishing. Building it once here keeps the e2e input independent
      # of a second packaging run.
      - name: Stage the Maven artifacts for the release-e2e gate
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          ./gradlew -Poml_version="${OML_VERSION:?tag version missing}" \
            -Dmaven.repo.local="$RUNNER_TEMP/loader-m2" publishToMavenLocal
          mkdir -p "$RUNNER_TEMP/loader-staging"
          cp -R "$RUNNER_TEMP/loader-m2/org" "$RUNNER_TEMP/loader-staging/"
          (
            cd "$RUNNER_TEMP/loader-staging"
            find org/ohmyloader -type f ! -name 'maven-metadata-local.xml' -print0 \
              | sort -z | xargs -0 sha256sum > SHA256SUMS
            tar -czf "$RUNNER_TEMP/loader-staging.tgz" org SHA256SUMS
          )
      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: loader-staging-maven
          path: ${{ runner.temp }}/loader-staging.tgz
          if-no-files-found: error
      # `build` never executes the artifact it ships. The Java 8 bootstrap, the Main-Class, the
      # embedded layer, the packaged natives and both message bundles are only proven by running the
      # jar — and this runs before the upload, so a jar that cannot install is never published.
      - name: The installer fat jar must run and install offline
        run: |
          set -e
          jar=$(ls dist/oml-installer-*.jar)
          java -jar "$jar" --help > /dev/null
          mkdir -p "$RUNNER_TEMP/oml-smoke"
          java -jar "$jar" --target standard --dir "$RUNNER_TEMP/oml-smoke" \
            --version 26.3 --isolation true --side client
          json="$RUNNER_TEMP/oml-smoke/versions/26.3-OML/26.3-OML.json"
          grep -q '"mainClass": "org.ohmyloader.launcher.OMLBootstrap"' "$json"
          compgen -G "$RUNNER_TEMP/oml-smoke/versions/26.3-OML/natives/*" > /dev/null
          test -d "$RUNNER_TEMP/oml-smoke/versions/26.3-OML/mods"
      - uses: actions/upload-artifact@v7
        with:
          name: oml-installer
          path: dist/oml-installer-*.jar
          if-no-files-found: error

  # Windows coverage for two things the ubuntu job cannot decide: the installer's platform branches
  # (CRLF batch scripts, path separators, code page handling) and the real `oml-native.dll` load —
  # oml-core's codec tests dlopen the library zig built for this platform, so they are the only place
  # the Windows artifact's exports are ever bound. zig is needed for both: the installer's
  # processResources embeds the library, and the codec tests read its build layout.
  windows-test:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '27'
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: gradle/actions/setup-gradle@v6
      # Same build-cache snapshot design as the build job (see there). Keyed per OS: the cached
      # artifacts are platform-specific compilation outputs. The zig toolchain installed above
      # lives outside this path.
      - uses: actions/cache@v6
        with:
          # Windows: ~ expands to HOME; %VAR% does not, so the backslash form below is the
          # documented way to spell a Windows user path here
          path: |
            ~\.gradle\caches\build-cache-*
          key: gradle-build-cache-${{ runner.os }}-${{ hashFiles('**/*.kt', '**/*.kts', '**/*.java', 'gradle/libs.versions.toml', 'gradle.properties') }}
          restore-keys: |
            gradle-build-cache-${{ runner.os }}-
      # The codec tests look for the library in zig's build layout and assume-skip when it is absent,
      # so the build has to be realized before them and the skip has to be checked after — a green job
      # in which every native test skipped would prove nothing.
      - run: ./gradlew.bat :oml-native:buildOmlNative
      - run: ./gradlew.bat :oml-core:test :oml-installer:test :oml-devtools:test
      - name: The native codec tests must not have skipped
        shell: bash
        run: |
          for suite in OmlNativeZstdTest ZstdChunkCodecTest; do
            f="oml-core/build/test-results/test/TEST-org.ohmyloader.core.compression.$suite.xml"
            if ! grep -q 'skipped="0"' "$f"; then
              echo "::error::$suite never loaded oml-native.dll (skipped or absent): $f"
              exit 1
            fi
            echo "$suite ran against the real oml-native.dll"
          done

  # A tag is publishable only after the verification mod boots this tag's loader on both sides.
  # GitHub does not allow expressions in `uses`, so the verification repo is checked out at the
  # pin in vars.OML_TESTMOD_REF and its scripts are run directly; vars.OML_GRADLE_REF pins the
  # plugin. The gate fails when either pin is unset: an unpinned verification is not evidence.
  e2e-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Require pinned verification refs
        env:
          TESTMOD_REF: ${{ vars.OML_TESTMOD_REF }}
          GRADLE_REF: ${{ vars.OML_GRADLE_REF }}
        run: |
          if [ -z "$TESTMOD_REF" ]; then
            echo "::error::set the OML_TESTMOD_REF repository variable to the TestMod commit this release is verified against"
            exit 1
          fi
          if [ -z "$GRADLE_REF" ]; then
            echo "::error::set the OML_GRADLE_REF repository variable to the Gradle plugin commit this release is verified against"
            exit 1
          fi
      - name: Checkout the verification mod
        uses: actions/checkout@v7
        with:
          repository: OhMyLoader/OhMyLoaderTestMod
          ref: ${{ vars.OML_TESTMOD_REF }}
          path: OhMyLoaderTestMod
      - name: Checkout the loader under test
        uses: actions/checkout@v7
        with:
          repository: OhMyLoader/OhMyLoader
          ref: ${{ github.sha }}
          path: OhMyLoaderTestMod/OhMyLoader
      - name: Checkout the Gradle plugin under test
        uses: actions/checkout@v7
        with:
          repository: OhMyLoader/OhMyLoaderGradle
          ref: ${{ vars.OML_GRADLE_REF }}
          path: OhMyLoaderTestMod/OhMyLoaderGradle
      - name: Download the artifacts the build job staged
        uses: actions/download-artifact@v8
        with:
          name: loader-staging-maven
          path: ${{ runner.temp }}/loader-staging
      - name: Install the tested artifacts into mavenLocal
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/loader-staging-extracted"
          tar -xzf "$RUNNER_TEMP/loader-staging/loader-staging.tgz" \
            -C "$RUNNER_TEMP/loader-staging-extracted"
          cd "$RUNNER_TEMP/loader-staging-extracted"
          sha256sum --check SHA256SUMS
          mkdir -p "$HOME/.m2/repository"
          cp -R org "$HOME/.m2/repository/"
          mkdir -p "$GITHUB_WORKSPACE/OhMyLoaderTestMod/build"
          cp SHA256SUMS "$GITHUB_WORKSPACE/OhMyLoaderTestMod/build/loader-staging-SHA256SUMS"
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '27'
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/cache@v6
        with:
          path: ~/.gradle/caches/build-cache-*
          key: gradle-build-cache-${{ runner.os }}-${{ hashFiles('OhMyLoaderTestMod/**/*.kt', 'OhMyLoaderTestMod/**/*.kts', 'OhMyLoaderTestMod/**/*.java', 'OhMyLoaderTestMod/gradle/libs.versions.toml', 'OhMyLoaderTestMod/gradle.properties') }}
          restore-keys: |
            gradle-build-cache-${{ runner.os }}-
      - uses: actions/cache@v6
        with:
          path: |
            OhMyLoaderTestMod/run/${{ vars.OML_GAME_VERSION || '26.3' }}/minecraft
            OhMyLoaderTestMod/run/${{ vars.OML_GAME_VERSION || '26.3' }}/libraries
            OhMyLoaderTestMod/run/${{ vars.OML_GAME_VERSION || '26.3' }}/natives
          key: game-files-${{ vars.OML_GAME_VERSION || '26.3' }}-${{ hashFiles('OhMyLoaderTestMod/gradle.properties', 'OhMyLoaderTestMod/build.gradle.kts') }}
      - name: Headless rendering stack
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb mesa-vulkan-drivers libgl1-mesa-dri libglx-mesa0 libopenal1
      - name: Release gate end-to-end
        working-directory: OhMyLoaderTestMod
        env:
          OML_GAME_VERSION: ${{ vars.OML_GAME_VERSION || '26.3' }}
          OML_GATE_VERSION: ${{ github.ref_name }}
          OML_E2E_USE_STAGED_LOADER: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
          OML_E2E_TIMEOUT: '900'
          OML_E2E_WATCHDOG: '840'
          OML_E2E_GRACE_SECONDS: '720'
        run: bash ./scripts/ci-e2e.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-e2e-evidence
          path: |
            OhMyLoaderTestMod/build/e2e-*.log
            OhMyLoaderTestMod/build/e2e-*.json
            OhMyLoaderTestMod/build/loader-staging-SHA256SUMS
            OhMyLoaderTestMod/run/client/logs/latest.log
            OhMyLoaderTestMod/run/client/crash-reports/**
            OhMyLoaderTestMod/run/client/hs_err_pid*.log
            OhMyLoaderTestMod/run/client/options.txt
            OhMyLoaderTestMod/run/server/logs/latest.log
            OhMyLoaderTestMod/run/server/logs/oml-console.log
            OhMyLoaderTestMod/run/server/crash-reports/**
            OhMyLoaderTestMod/run/server/hs_err_pid*.log
            OhMyLoaderTestMod/run/server/server.properties
          if-no-files-found: warn
      - name: The release gate must leave a verdict
        if: success()
        run: |
          for file in \
            OhMyLoaderTestMod/build/e2e-result-server.json \
            OhMyLoaderTestMod/build/e2e-result-client.json \
            OhMyLoaderTestMod/build/e2e-result-multiplayer-server.json \
            OhMyLoaderTestMod/build/e2e-result-multiplayer-client.json; do
            test -f "$file" || { echo "::error::missing e2e evidence: $file"; exit 1; }
          done

  # Tag build: all Maven coordinates published to GitHub Packages (the interim Maven server
  # until a dedicated one exists) with the proper version via -Poml_version, and the installer
  # fat jar built by the build job above — carrying the same version, because that job received
  # the tag too — is attached to the GitHub Release. No rebuild of the installer here.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    # windows-test is a prerequisite because the release publishes oml-native and ships the installer:
    # that job is the only coverage of the Windows library load and the installer's Windows branches,
    # and a release must not go out while either is red. e2e-release is the only job that boots the
    # tagged loader; without it the release evidence would contain zero game launches.
    needs: [build, windows-test, e2e-release]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '27'
      # `publish` at the root includes :oml-native, whose natives jars dependOn buildOmlNative — the
      # publish shells out to zig. Depending on a remote build-cache hit from the build job would make
      # the release fail on one cache eviction.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/download-artifact@v8
        with:
          name: loader-staging-maven
          path: ${{ runner.temp }}/loader-staging
      - name: Verify the staged artifact manifest
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/loader-staging-extracted"
          tar -xzf "$RUNNER_TEMP/loader-staging/loader-staging.tgz" \
            -C "$RUNNER_TEMP/loader-staging-extracted"
          cd "$RUNNER_TEMP/loader-staging-extracted"
          sha256sum --check SHA256SUMS
      # The release must ship the bytes the e2e gate verified. Rebuild them here and compare before
      # touching GitHub Packages; a mismatch fails the tag instead of publishing a different tree.
      - name: Rebuild and compare against the tested bytes
        run: |
          set -euo pipefail
          ./gradlew -Poml_version="${GITHUB_REF_NAME#v}" \
            -Dmaven.repo.local="$RUNNER_TEMP/release-m2" publishToMavenLocal
          (
            cd "$RUNNER_TEMP/release-m2"
            find org/ohmyloader -type f ! -name 'maven-metadata-local.xml' -print0 \
              | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/release-SHA256SUMS"
          )
          diff -u "$RUNNER_TEMP/loader-staging-extracted/SHA256SUMS" \
            "$RUNNER_TEMP/release-SHA256SUMS"
      - run: ./gradlew -Poml_version="${GITHUB_REF_NAME#v}" publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v8
        with:
          name: oml-installer
          path: dist
      # The release is only as good as its asset: if a build-graph change ever drops shadowJar
      # from `build`, this fails the job instead of publishing a release with nothing attached.
      - name: The installer fat jar must exist before publishing
        run: ls -l dist/oml-installer-*.jar
      - name: Record the installer checksum
        run: sha256sum dist/oml-installer-*.jar > dist/oml-installer.sha256
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/oml-installer-*.jar
            dist/oml-installer.sha256
          fail_on_unmatched_files: true
