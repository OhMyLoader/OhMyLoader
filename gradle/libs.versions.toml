[versions]
# Pinned to a beta deliberately: this is the newest compiler the injection engine's bytecode output
# is verified against. Do not bump it casually — an upgrade needs the full regression pass (every
# module's tests plus a real client and server boot from OhMyLoaderTestMod), because the compiled
# hook classes run inside a patched game JVM where a silent codegen change is a runtime failure,
# not a build failure.
kotlin = "2.5.0-Beta1"
asm = "9.11"
kotlinxSerialization = "1.11.0"
shadow = "9.6.1"
flatlaf = "3.7.2"
netty = "4.2.19.Final"
gson = "2.14.0"
brigadier = "1.3.11"
datafixerupper = "10.0.21"
# The game's own vector library: `Component`'s statics need it at test run time.
joml = "1.10.9"

[libraries]
kotlinGradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }

kotlinxSerializationJson = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

asm = { module = "org.ow2.asm:asm", version.ref = "asm" }
asmTree = { module = "org.ow2.asm:asm-tree", version.ref = "asm" }
asmAnalysis = { module = "org.ow2.asm:asm-analysis", version.ref = "asm" }
asmCommons = { module = "org.ow2.asm:asm-commons", version.ref = "asm" }

flatlaf = { module = "com.formdev:flatlaf", version.ref = "flatlaf" }

gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
brigadier = { module = "com.mojang:brigadier", version.ref = "brigadier" }
datafixerupper = { module = "com.mojang:datafixerupper", version.ref = "datafixerupper" }
joml = { module = "org.joml:joml", version.ref = "joml" }
nettyCodecBase = { module = "io.netty:netty-codec-base", version.ref = "netty" }
nettyTransport = { module = "io.netty:netty-transport", version.ref = "netty" }

[bundles]
asm = ["asm", "asmTree", "asmAnalysis", "asmCommons"]

[plugins]
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlinPluginSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
